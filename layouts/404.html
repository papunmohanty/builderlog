<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found</title>
    <style>
      /* Reset & Base Styles */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f172a;
        color: #f8fafc;
        overflow: hidden;
        position: relative;
      }

      /* Animated Ambient Background Glow */
      .bg-glow {
        position: absolute;
        width: 600px;
        height: 600px;
        background: radial-gradient(
          circle,
          rgba(99, 102, 241, 0.25) 0%,
          rgba(15, 23, 42, 0) 70%
        );
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        animation: pulse 6s ease-in-out infinite alternate;
        z-index: 0;
      }

      /* Container Card */
      .container {
        position: relative;
        z-index: 1;
        text-align: center;
        padding: 3rem 2rem;
        max-width: 520px;
        background: rgba(30, 41, 59, 0.7);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      }

      /* Floating Illustration */
      .illustration {
        width: 120px;
        height: 120px;
        margin: 0 auto 1.5rem;
        animation: float 4s ease-in-out infinite;
      }

      .illustration svg {
        width: 100%;
        height: 100%;
        fill: none;
        stroke: #818cf8;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: drop-shadow(0 0 10px rgba(129, 140, 248, 0.4));
      }

      /* 404 Text Styling */
      .error-code {
        font-size: 5.5rem;
        font-weight: 900;
        line-height: 1;
        letter-spacing: -2px;
        background: linear-gradient(135deg, #ffffff 0%, #818cf8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 0.5rem;
      }

      .title {
        font-size: 1.5rem;
        font-weight: 600;
        color: #f1f5f9;
        margin-bottom: 0.75rem;
      }

      .description {
        font-size: 0.975rem;
        color: #94a3b8;
        line-height: 1.6;
        margin-bottom: 2rem;
      }

      /* Buttons Container */
      .button-group {
        display: flex;
        gap: 1rem;
        justify-content: center;
        flex-wrap: wrap;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.75rem 1.5rem;
        font-size: 0.95rem;
        font-weight: 600;
        border-radius: 12px;
        text-decoration: none;
        transition: all 0.25s ease;
        cursor: pointer;
      }

      .btn-primary {
        background: #6366f1;
        color: #ffffff;
        box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
      }

      .btn-primary:hover {
        background: #4f46e5;
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
      }

      .btn-secondary {
        background: rgba(255, 255, 255, 0.05);
        color: #cbd5e1;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.1);
        color: #ffffff;
        transform: translateY(-2px);
      }

      /* Keyframe Animations */
      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-12px);
        }
      }

      @keyframes pulse {
        0% {
          transform: translate(-50%, -50%) scale(0.8);
          opacity: 0.5;
        }
        100% {
          transform: translate(-50%, -50%) scale(1.2);
          opacity: 0.9;
        }
      }
    </style>
  </head>
  <body>
    <!-- Background Animated Glow -->
    <div class="bg-glow"></div>

    <!-- Main Content Card -->
    <div class="container">
      <!-- Floating SVG Graphic -->
      <div class="illustration">
        <svg viewBox="0 0 24 24">
          <path
            d="M12 2a8 8 0 0 0-8 8v12l3-3 3 3 3-3 3 3 3-3 3 3V10a8 8 0 0 0-8-8z"
          ></path>
          <circle cx="9" cy="10" r="1" fill="#818cf8"></circle>
          <circle cx="15" cy="10" r="1" fill="#818cf8"></circle>
        </svg>
      </div>

      <div class="error-code">404</div>
      <h1 class="title">Page Not Found</h1>
      <p class="description">
        The page you are looking for doesn't exist or has been moved to another
        URL.
      </p>

      <!-- Action Buttons -->
      <div class="button-group">
        <a href="/builderlog" class="btn btn-primary"> Back to Home </a>
        <a href="javascript:history.back()" class="btn btn-secondary">
          Go Back
        </a>
      </div>
    </div>
  </body>
</html>
